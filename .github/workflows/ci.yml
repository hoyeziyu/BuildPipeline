name: C++ CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [debug, release]

    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vendor/vcpkg

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # vcpkg.json 的 builtin-baseline 需要 git 能解析该提交上的 versions/baseline.json；
      # 子模块默认浅克隆时会出现 git show ... baseline.json 失败，需拉全历史或取消 shallow。
      - name: Unshallow vcpkg submodule (for manifest baseline)
        shell: bash
        run: |
          cd vendor/vcpkg
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow
          fi

      # bootstrap-vcpkg 在 Windows 上会编译 vcpkg，需要先能用 MSVC
      - name: Enable MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg
        shell: cmd
        run: vendor\vcpkg\bootstrap-vcpkg.bat

      # 与 CMakePresets.json 一致：windows-msvc-release / release / dev-zip
      - name: Configure CMake
        run: cmake --preset windows-msvc-${{ matrix.config }}

      - name: Build project
        run: cmake --build --preset ${{ matrix.config }}

      - name: Run tests
        run: ctest --preset ${{ matrix.config }}

      - name: Package
        if: matrix.config == 'release'
        run: cpack --preset dev-zip

      # 在 CI 运行器上创建的任何文件都是临时的。作业完成后，虚拟机被销毁，所有文件丢失。为了保留作业的输出，我们需要使用工作流工件(artifacts)
      # 工件artifacts是从工作流程运行中保存的文件或文件集合。作业完成后，你可以从 GitHub 上的工作流程摘要页面查看并下载其工件artifacts 
      - name: Upload Package Artifact
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Greeter-Package-${{ matrix.os }}-${{ matrix.config}} 
          path: build/msvc-release/Greeter-*-Development.zip